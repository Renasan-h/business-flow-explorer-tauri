name: Tauri Windows CI

on:
  push:
    branches: [main, develop_tauri]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Windows icon
        run: node scripts/generate-icon.mjs
      - name: Test native YAML commands
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run build
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = 'portable'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          $exe = 'src-tauri/target/release/business-flow-explorer-tauri.exe'
          if (-not (Test-Path $exe)) { throw "Portable executable not found: $exe" }
          Copy-Item $exe "$portable/BusinessFlowExplorer.exe"
          Copy-Item README.md "$portable/README.md"
          Compress-Archive -Path "$portable/*" -DestinationPath 'BusinessFlowExplorer-Windows-Portable.zip' -Force
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: business-flow-explorer-portable-windows
          path: BusinessFlowExplorer-Windows-Portable.zip
          if-no-files-found: error
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: business-flow-explorer-windows
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

name: Tauri Windows CI

on:
  push:
    branches: [main, develop_tauri]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Windows icon
        run: node scripts/generate-icon.mjs
      - name: Test native YAML commands
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Check TypeScript and build frontend
        run: npm run build:web
      - name: Verify generated scenario manifest is committed
        run: git diff --exit-code -- public/scenarios/manifest.json
      - name: Check Rust application
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build Windows executable (without installer)
        run: npx tauri build --no-bundle

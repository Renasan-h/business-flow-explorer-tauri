name: Full development checks

on:
  push:
    branches: [develop_tauri, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-checks:
    name: Frontend + Rust tests + Rust check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare frontend (development branch)
        if: github.ref == 'refs/heads/develop_tauri'
        run: npm run build:web
      - name: Verify generated scenario manifest
        if: github.ref == 'refs/heads/develop_tauri'
        run: git diff --exit-code -- public/scenarios/manifest.json
      - name: Prepare frontend (main wrapper)
        if: github.ref == 'refs/heads/main'
        run: npm run setup:web
      - name: Check frontend build (main wrapper)
        if: github.ref == 'refs/heads/main'
        run: npm --prefix web run build
      - name: Generate Windows icon
        run: node scripts/generate-icon.mjs
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml

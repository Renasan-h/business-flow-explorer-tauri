name: Frontend checks

on:
  # PR作成・更新では起動せず、必要なときだけ手動実行する。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Frontend build and unit tests
        run: npm run test:unit
      - name: Verify scenario manifest
        run: git diff --exit-code -- public/scenarios/manifest.json
